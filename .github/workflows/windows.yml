name: Windows tests and release

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, '386']
    env:
      GOARCH: ${{ matrix.arch }}
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.0'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Go tests and vet
        shell: pwsh
        run: |
          go test ./... -count=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go vet ./...
          exit $LASTEXITCODE
      - name: GUI protocol and interaction tests
        run: node --test gui_test.js
      - name: Install browser test tool
        if: matrix.arch == 'amd64'
        run: npm install --prefix dist/browser-tools --no-audit --no-fund --ignore-scripts playwright@1.64.0
      - name: Full GUI smoke test in Edge
        if: matrix.arch == 'amd64'
        env:
          WDC_PLAYWRIGHT_MODULE: ${{ github.workspace }}/dist/browser-tools/node_modules/playwright
        run: node scripts/gui-smoke.cjs

  race:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.0'
      - name: Race detector
        shell: pwsh
        env:
          CGO_ENABLED: '1'
          GOARCH: amd64
        run: |
          if (-not (Get-Command gcc -ErrorAction SilentlyContinue)) {
            $env:PATH = "C:\msys64\mingw64\bin;$env:PATH"
          }
          go test -race ./... -count=1
          exit $LASTEXITCODE

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, race]
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.0'
      - name: Build and package verified tag
        shell: powershell
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: ./scripts/package.ps1 -ExpectedVersion $env:RELEASE_TAG
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-release
          path: dist/release/*
          if-no-files-found: error
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: |
          $version = $env:RELEASE_TAG
          gh release create $version dist/release/WinDriveCleaner-x64.exe dist/release/WinDriveCleaner-x86.exe "dist/release/WinDriveCleaner-$version.zip" dist/release/SHA256SUMS --verify-tag --draft --title "$version — 安全缓存清理与可取消扫描" --notes-file "release/$version/NOTES.md"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $release = gh release view $version --json assets | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $release.assets.Count -ne 4) { throw 'Release attachment count mismatch' }
          foreach ($asset in $release.assets) {
            $local = Get-Item -LiteralPath (Join-Path 'dist/release' $asset.name)
            $hash = (Get-FileHash -LiteralPath $local.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($asset.size -ne $local.Length -or $asset.digest -ne "sha256:$hash" -or $asset.state -ne 'uploaded') { throw "Attachment verification failed: $($asset.name)" }
          }
          gh release edit $version --draft=false --latest
          exit $LASTEXITCODE
